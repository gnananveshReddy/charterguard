[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "charterguard"
version = "0.1.0"
description = "Framework-agnostic guardrail pipeline for LLM agent harnesses: injection, jailbreak, scope, redaction, grounding, audit."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["llm", "agents", "guardrails", "prompt-injection", "security"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Deliberately zero runtime dependencies: this component must drop into any
# project without dragging a framework, a model SDK, or a regex engine with it.
dependencies = []

[project.urls]
Homepage = "https://github.com/gnananveshReddy/charterguard"
Documentation = "https://gnananveshreddy.github.io/charterguard/"
Source = "https://github.com/gnananveshReddy/charterguard"
Changelog = "https://github.com/gnananveshReddy/charterguard/blob/main/CHANGELOG.md"
Issues = "https://github.com/gnananveshReddy/charterguard/issues"

[project.scripts]
charterguard = "charterguard.cli:main"

[project.optional-dependencies]
# Every extra is genuinely optional: the core, the FastAPI-free path, and all
# stdlib adapters (logging/console/statsd metrics, sqlite ledger + audit, HTTP
# model/intent/NER, keyword intent, gazetteer NER) work with none of these
# installed. Install only the tier you actually operate.
fastapi = ["fastapi>=0.110"]
langchain = ["langchain-core>=0.3"]
# The LangGraph nodes import no third-party symbol; this extra exists so
# `[langgraph]` installs the framework you are wiring them into.
langgraph = ["langgraph>=0.2"]
# Cross-host session ceilings. Needed only if you run more than one host.
redis = ["redis>=5.0"]
# Metrics egress. Pick one; installing both is supported but pointless.
prometheus = ["prometheus-client>=0.20"]
otel = ["opentelemetry-api>=1.24"]
# Free-text PII (names, locations). Both also require a spaCy model download,
# which pip cannot express -- see docs/adapters.md.
spacy = ["spacy>=3.7"]
presidio = ["presidio-analyzer>=2.2", "spacy>=3.7"]
# Local model tier. onnxruntime + tokenizers only: no torch, no transformers,
# and no weights are bundled. Weights are fetched by pinned commit SHA and
# verified by SHA-256 at load. See SECURITY.md.
onnx = ["onnxruntime>=1.17", "tokenizers>=0.15"]
# Agent SDK adapters. Minimums are the versions the adapters were verified against.
openai-agents = ["openai-agents>=0.24"]
claude-agent-sdk = ["claude-agent-sdk>=0.2.176"]
pydantic-ai = ["pydantic-ai-slim>=2.65"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.6", "mypy>=1.10", "pre-commit>=3.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/charterguard"]
# py.typed ships the annotations: the Protocol seams are the public API, and
# without this marker every downstream type checker sees them as Any.
artifacts = ["src/charterguard/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Set explicitly: pytest-asyncio warns when it is unset, and filterwarnings
# = error turns that warning into a collection failure.
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: correctness. B: bugbear. S: bandit -- this is a security component, so
# its own code is held to security lint. UP/SIM: modern, simple Python.
select = ["E", "F", "W", "B", "S", "UP", "SIM"]
ignore = [
    "SIM105",  # try/except/pass keeps the "why this must never raise" comment in place
    "SIM108",  # ternaries over multi-clause conditions hurt readability
    "UP042",  # (str, Enum) is kept: StrEnum changes str() output, a public behaviour
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607", "E501"]
"benchmarks/**" = ["S101", "S311", "E501"]
"tools/**" = ["S101"]
# Rule tables and literal lists: one entry per line reads better than wrapping
# a regex mid-alternation.
"src/charterguard/patterns.py" = ["E501"]
"src/charterguard/prefilter.py" = ["E501"]
"src/charterguard/integrations/heuristics.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
