version: 2
updates:
  # Workflow actions: keeps the pinned versions in CI, CodeQL, Scorecard and
  # the release workflow current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Optional extras and dev tools. The core has no runtime dependencies, so
  # these only move the CI matrix.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Hash-pinned CI tool locks (lint, typing, test, build) and the docs
  # toolchain. Each .txt is compiled from the .in beside it:
  #   uv pip compile --generate-hashes --python-version 3.12   #     --python-platform linux -o X.txt X.in
  - package-ecosystem: pip
    directories: ["/.github/requirements", "/docs"]
    schedule:
      interval: weekly
    groups:
      ci-tools:
        patterns: ["*"]
