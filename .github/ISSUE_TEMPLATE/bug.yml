name: Bug
description: A crash, wrong result, or adapter problem that is not about detection quality.
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got. Include the traceback if any.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: charterguard version
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Python version, OS, and extras / framework versions
      placeholder: "3.12, Ubuntu 24.04, [langchain] langchain-core 0.3.x"
    validations:
      required: true
