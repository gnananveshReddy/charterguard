name: False positive
description: Benign text that charterguard flags or blocks.
labels: ["false-positive", "triage"]
body:
  - type: textarea
    id: input
    attributes:
      label: Input
      description: The smallest benign text that triggers it. Remove anything sensitive or personal.
      render: text
    validations:
      required: true
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      options: [check_input, inspect_untrusted, inspect_tool_output, check_output, check_tool_call]
    validations:
      required: true
  - type: dropdown
    id: preset
    attributes:
      label: Config
      options: [default, strict, report_only, custom policy file]
    validations:
      required: true
  - type: textarea
    id: verdict
    attributes:
      label: Verdict received
      description: "`charterguard scan --json` output: rule ids and severities."
      render: json
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why this is benign
      description: What the user or document was actually doing. This helps word the fix so it doesn't open a bypass.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "charterguard version"
    validations:
      required: true
