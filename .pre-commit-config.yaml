# Install once with `pre-commit install`; runs the same checks CI enforces.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: detect-private-key
        # Test fixtures deliberately contain key-shaped strings.
        exclude: ^tests/
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src/charterguard
        language: system
        pass_filenames: false
        types: [python]
