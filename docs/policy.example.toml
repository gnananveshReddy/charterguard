# Example charterguard policy. Load with:
#
#   GuardrailConfig.from_file("guardrails.toml")
#   charterguard scan --policy guardrails.toml
#   charterguard policy guardrails.toml        # validate + print effective policy
#
# Unknown keys, wrong types and out-of-range thresholds are errors, so a typo
# can never silently weaken enforcement.

preset = "default"                # default | strict | report_only
policy_version = "example-2026.11"

# report -> flag -> block, per category. "all" is applied first.
[modes]
injection = "block"
jailbreak = "block"
secret = "block"
pii = "flag"                      # PII is redacted on output either way
restricted_topic = "report"

[flag_at]
pii = 0.40

[block_at]
injection = 0.80

[budget]
max_chars = 200_000
tail_chars = 8_000

# Inert unless a ModelScorer is passed to the pipeline.
[model]
enabled = true
fail_closed = false
timeout_s = 1.5

[model_by_layer.input]
escalate_clean = true             # every user turn gets the classifier

[model_by_layer.untrusted]
escalate_clean = true
clean_sample_rate = 0.05          # 5% of clean retrieved chunks

[redaction]
categories = ["secret", "pii"]
placeholder = "[REDACTED:{kind}]"

[volume]
max_rows = 5_000
max_pii_values = 50
